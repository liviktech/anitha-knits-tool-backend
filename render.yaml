services:
  - type: web
    name: anitha-knits-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_COOKIE_NAME
        value: access_token
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_COOKIE_NAME
        value: refresh_token
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: PLATFORM_ADMIN_JWT_SECRET
        sync: false
      - key: PLATFORM_ADMIN_JWT_EXPIRES_IN
        value: 15m
      - key: PLATFORM_ADMIN_ACCESS_COOKIE_NAME
        value: platform_admin_access_token
      - key: PLATFORM_ADMIN_JWT_REFRESH_SECRET
        sync: false
      - key: PLATFORM_ADMIN_JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PLATFORM_ADMIN_REFRESH_COOKIE_NAME
        value: platform_admin_refresh_token
